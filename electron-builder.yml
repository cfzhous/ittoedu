appId: com.ittoedu.courseware-editor
productName: ittoedu Courseware Editor
asar: true
asarUnpack:
  - "**/*.node"
directories:
  output: release
files:
  - dist-electron/**
  - dist-renderer/**
  - dist-player/**
  - resources/icons/**
  - package.json
win:
  icon: resources/icons/icon.ico
  executableName: ittoedu-courseware-editor
  target:
    - target: portable
      arch:
        - x64
    - target: dir
      arch:
        - x64
  requestedExecutionLevel: asInvoker
portable:
  artifactName: ittoedu-courseware-editor-portable-${version}.${ext}
artifactName: ittoedu-courseware-editor-${version}-${arch}.${ext}
npmRebuild: false
publish: null
