name: Clean Windows verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  clean-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run verify:clean-windows
